<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ava Kelly</title>
<meta name="description" content="Ava Kelly: art and architecture portfolio.">

<style>
  :root { --bg: #fbfaf7; --fg: #1d1d1f; --muted: #5b5b60; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141415; --fg: #f2f2f0; --muted: #a9a9ad; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 18vh 16px 4rem; }
  h1 { font-size: clamp(2.25rem, 7vw, 3.5rem); line-height: 1.1; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1rem; }
</style>
</head>
<body>
<main>
  <h1>Ava Kelly</h1>
  <p>Art and architecture portfolio.</p>
  <p>A new site is on its way.</p>
</main>
</body>
</html>
